# CI: portões que todo push/PR precisa passar.
# Espelha os hooks locais (lefthook.yml); o CI é a garantia final porque
# hooks são burláveis com --no-verify. O deploy vive em deploy.yml e só
# roda quando este workflow termina verde na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  backend:
    runs-on: ubuntu-latest
    # Postgres real como sidecar (mesmo engine de produção — nada de sqlite).
    # O runner só libera os steps quando o healthcheck passa, então não há
    # corrida de startup: o `make test-backend` encontra o banco pronto via
    # TEST_DATABASE_URL e pula o container efêmero local.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slothdule
          POSTGRES_PASSWORD: slothdule
          POSTGRES_DB: slothdule_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U slothdule -d slothdule_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://slothdule:slothdule@localhost:5434/slothdule_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: make test-backend

  docker:
    # Valida os Dockerfiles (build sem push) em todo PR e push.
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
