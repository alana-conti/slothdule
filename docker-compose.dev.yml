# Override de desenvolvimento: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up db api web`
# (atalho: `make dev`). Não use em produção.
services:
  web:
    build:
      target: dev
    command: npm run dev
    environment:
      # No dev o Next roda dentro do container, mas o navegador está no host:
      # o server usa a rede interna, o browser usa a URL pública do host.
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8002}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
