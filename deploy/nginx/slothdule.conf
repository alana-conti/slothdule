# Config de proxy do Slothdule (referência versionada).
#
# Deploy real: Nginx Proxy Manager (container). Copie este arquivo para
#   /data/nginx/custom/http.conf   (dentro do container do NPM)
# e recarregue: `docker exec composes-app-1 nginx -t && docker exec composes-app-1 nginx -s reload`.
# O NPM inclui custom/http.conf e nunca sobrescreve esse diretório.
#
# Upstreams: rede externa `proxy-net`, aliases `slothdule-web` (3000) e
# `slothdule-api` (8000). Criar a rede uma vez: `docker network create proxy-net`.
# `client_max_body_size 20m` no vhost da API (uploads até 20 MB).
#
# Certificado Let's Encrypt emitido com certbot webroot:
#   certbot certonly --webroot -w /data/letsencrypt-acme-challenge \
#     -d app.slothdule.guivi.tech -d api.slothdule.guivi.tech \
#     --cert-name slothdule --non-interactive --agree-tos --key-type ecdsa
# Renovação: cron diário no host chamando `certbot renew --cert-name slothdule`.
#
# Para nginx puro (fora do NPM), troque `include conf.d/include/proxy.conf;` por
# um bloco proxy_pass explícito (ver README).
# ============================================================

# ============================================================
# Slothdule — proxy gerenciado por arquivo (fora da UI do NPM).
# app.slothdule.guivi.tech -> front  (slothdule-web:3000)
# api.slothdule.guivi.tech -> back   (slothdule-api:8000)
# Cert: /etc/letsencrypt/live/slothdule (Let's Encrypt, via certbot webroot)
# ============================================================

# app.slothdule.guivi.tech (frontend) - HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.slothdule.guivi.tech;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.slothdule.guivi.tech;

    ssl_certificate     /etc/letsencrypt/live/slothdule/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slothdule/privkey.pem;
    include conf.d/include/ssl-ciphers.conf;

    set $forward_scheme http;
    set $server         "slothdule-web";
    set $port           3000;

    location / {
        include conf.d/include/proxy.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# api.slothdule.guivi.tech (backend) - HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.slothdule.guivi.tech;

    include conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.slothdule.guivi.tech;

    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/slothdule/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slothdule/privkey.pem;
    include conf.d/include/ssl-ciphers.conf;

    set $forward_scheme http;
    set $server         "slothdule-api";
    set $port           8000;

    location / {
        include conf.d/include/proxy.conf;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
